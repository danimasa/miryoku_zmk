name: 'Build corne'
on: workflow_dispatch
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      # Corne with OLED display, matching danimasa/zmk-config:
      # zmk-nice-oled module (mctechnology17) provides the nice_oled
      # shield + custom status screen; module is tested on ZMK v0.3.0
      # and not yet updated for Zephyr 4.1, so pin ZMK to v0.3.0.
      # v0.3.0 predates HWMv2: old board name nice_nano_v2 (no @rev//zmk).
      board: '["nice_nano_v2"]'
      shield: '["corne_left nice_oled","corne_right nice_oled","settings_reset"]'
      branches: '["zmkfirmware/zmk/v0.3.0"]'
      modules: '["mctechnology17/zmk-nice-oled/main"]'
      kconfig: '["CONFIG_ZMK_DISPLAY=y\nCONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y\nCONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y"]'
